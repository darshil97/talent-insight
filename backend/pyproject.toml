[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-insight-backend"
version = "0.1.0"
description = "Backend for the Talent Insight recruiting assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.0.55",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fixtures/*.json", "fixtures/jobs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["neon: opt-in read-only checks against the configured shared Neon catalog"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
