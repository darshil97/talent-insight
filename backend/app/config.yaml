# Backend defaults. Secrets stay in backend/.env or the host environment.
# A value such as ${NAME} uses NAME when set; an empty or unset value is null.
# ${NAME:-fallback} supplies a fallback when NAME is empty or unset.
# Explicit Settings arguments > process variables > backend/.env > this file.
# Unknown or duplicate YAML keys fail startup.

api:
  docs_enabled: true
  cors_allowed_origins: []
  log_level: INFO

database:
  url: ${DATABASE_URL}
  direct_url: ${DIRECT_DATABASE_URL}

resumes:
  max_bytes: 5242880
  max_pages: 20
  max_characters: 100000
  timeout_seconds: 10
  upload_timeout_seconds: 15
  max_concurrent: 2

ai:
  mode: ${AI_MODE}
  temperature: 0
  max_input_characters: 20000
  max_output_tokens: 8192
  timeout_seconds: 130
  max_attempts: 2
  max_concurrent: 1
  requests_per_minute: 5
  bedrock:
    region: ${AWS_REGION}
    model_id: ${BEDROCK_MODEL_ID}
    bearer_token: ${AWS_BEARER_TOKEN_BEDROCK}
    profile: ${AWS_PROFILE}
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    session_token: ${AWS_SESSION_TOKEN}
    structured_method: json_schema
    reasoning_effort: ${BEDROCK_REASONING_EFFORT}

matching:
  weights:
    mandatory: 50
    experience: 25
    preferred: 15
    qualification: 10
  credits:
    transferable: 0.75
    partial: 0.5

ranking:
  # [maximum days to join, bonus]; longer or unknown availability earns 0.
  availability_tiers: [[15, 5], [30, 4], [45, 3], [60, 2], [90, 1]]

voice:
  # mock or deepgram; unset disables screening. The interviewer also needs ai.mode.
  mode: ${VOICE_MODE}
  deepgram_api_key: ${DEEPGRAM_API_KEY}
  # Signs upload screening context; at least 32 characters.
  signing_secret: ${SESSION_SIGNING_SECRET}
  # Public HTTPS backend origin that Deepgram calls for interviewer turns.
  public_api_url: ${VOICE_PUBLIC_API_URL}
  agent_url: wss://agent.deepgram.com/v1/agent/converse
  api_url: https://api.deepgram.com
  listen_model: flux-general-en
  speak_model: aura-2-thalia-en
  token_ttl_seconds: 30
  screening_seconds: 600
  wrap_up_seconds: 540
  session_expiry_seconds: 900
  context_ttl_seconds: 1800
  max_turns: 40
  max_reconnects: 2
  max_concurrent: 1
  sessions_per_hour: 6
  # A rolling 24-hour cap; like the hourly one, it is per process and resets on restart.
  sessions_per_day: 20
  max_messages: 80
  max_history_characters: 60000
  # Interviewer model and region; unset values use ai.bedrock. Prefer a low-latency model.
  bedrock_model_id: ${VOICE_BEDROCK_MODEL_ID}
  aws_region: ${VOICE_AWS_REGION}
  max_output_tokens: 300
  # Sent only to openai.gpt-oss models, which require reasoning; others get no reasoning field.
  reasoning_effort: low
  turn_timeout_seconds: 20

bot_check:
  # Cloudflare Turnstile before a screening starts. Off unless both keys are set;
  # the site key is public and reaches the browser through the screening notice.
  turnstile_site_key: ${TURNSTILE_SITE_KEY}
  turnstile_secret_key: ${TURNSTILE_SECRET_KEY}
